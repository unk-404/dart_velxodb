name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve workspace
        run: dart pub get
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            if [ -d "${dir}test" ]; then
              echo "::group::dart test ${dir}"
              dart test -j 1 "${dir}test"
              echo "::endgroup::"
            fi
          done

  web:
    name: web / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [js, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve workspace
        run: dart pub get
      # Compiling the entry point proves the library graph stays web-safe.
      - name: Compile ${{ matrix.target }}
        run: |
          if [ "${{ matrix.target }}" = "wasm" ]; then
            dart compile wasm packages/velxodb/example/velxodb_example.dart -o /tmp/smoke.wasm
          else
            dart compile js packages/velxodb/example/velxodb_example.dart -o /tmp/smoke.js
          fi

  browser:
    name: browser / chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve workspace
        run: dart pub get
      # Compiling is not enough: JS integer semantics and the handwritten UTF-8
      # encoder can only be checked by running the suite in a browser.
      - name: Run the suite in Chrome
        working-directory: packages/velxodb
        run: dart test -p chrome -j 1 test

  crash:
    name: crash matrix
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve workspace
        run: dart pub get
      # Every crash point: torn WAL frame byte, segment before manifest,
      # manifest fallback, pre-truncate replay, corrupt segment.
      - name: Run crash matrix
        run: dart test packages/velxodb/test/crash -j 1 --chain-stack-traces

  bench:
    name: benchmark
    needs: [test, web, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve workspace
        run: dart pub get
      - name: Run benchmarks
        working-directory: benchmarks
        run: dart run benchmark_test --output jsonl . > "$GITHUB_WORKSPACE/bench.jsonl"
      - name: Render chart
        uses: unk-404/benchcat@master
        with:
          input: bench.jsonl
          format: benchmark_test
          out: assets/benchmarks.svg
          config: benchmarks/benchcat.toml
      - name: Upload chart
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-svg
          path: assets/benchmarks.svg
          if-no-files-found: error

  compare:
    name: compare / isar + sled
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve workspace
        run: dart pub get
      - name: Resolve comparison harness
        working-directory: benchmarks/compare/dart
        run: dart pub get
      - name: Analyze comparison harness
        working-directory: benchmarks/compare/dart
        run: dart analyze --fatal-infos
      - name: Fetch isar core (Linux)
        run: |
          mkdir -p benchmarks/compare/dart/bin
          curl -fsSL https://binaries.isar-community.dev/3.4.1/libisar_linux_x64.so \
            -o benchmarks/compare/dart/bin/libisar.so
      - name: Run comparison suites
        run: python3 benchmarks/compare/run.py
      - name: Render engine chart
        uses: unk-404/benchcat@master
        with:
          config: benchmarks/compare/benchcat-engine.toml
          out: assets/benchmarks-engine.svg
      - name: Render database chart
        uses: unk-404/benchcat@master
        with:
          config: benchmarks/compare/benchcat-db.toml
          out: assets/benchmarks-db.svg
      - name: Upload comparison charts
        uses: actions/upload-artifact@v4
        with:
          name: compare-svg
          path: |
            assets/benchmarks-engine.svg
            assets/benchmarks-db.svg
          if-no-files-found: error

  assets:
    name: publish charts
    needs: [bench, compare]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect charts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-svg'
          merge-multiple: true
          path: assets
      - name: Commit charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/benchmarks.svg assets/benchmarks-engine.svg assets/benchmarks-db.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(bench): refresh charts [skip ci]"
          git push
