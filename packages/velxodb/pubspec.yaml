name: velxodb
description: Embedded, pure-Dart document database with zero-copy storage, pluggable object stores and Mongo-style APIs.
version: 0.1.0

# repository: https://github.com/your-org/dart_velxodb
# issue_tracker: https://github.com/your-org/dart_velxodb/issues

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  blit: ^0.1.6
  brotli_neo: ^0.1.2
  lzo_neo: ^0.1.2
  parquet: ^0.1.2
  snappy_neo: ^0.1.2
  zstd_neo: ^0.1.2

dev_dependencies:
  benchmark_test: ^0.1.2
  lints: ^6.0.0
  test: ^1.25.6
