# velxodb headline card: one row per layer.
#
# Full data lives in the per-layer cards (`benchmarks/cards/*.toml` ->
# `assets/benchmarks-format.svg`, `-storage`, `-query`, `-objectstore`).
#
# Row order, label, unit and group come from `benchmarks/results/hero.json`,
# which `tool/normalize.dart` builds from `lib/manifest.dart`; this file only
# decides which rows appear and how the card looks. There are no formulas here
# on purpose: a factor that lives in the config cannot be tested.
[font]
family = "sniglet"

[render]
title = "velxodb"
subtitle = "{platform|local} - commit {commit:short|local} - JIT micro suite"
footer = "One row per layer; per-layer cards have the full set"
width = 920
kaomoji = ""

[[series]]
label = "velxodb"
input = "benchmarks/results/hero.json"
format = "json"
color = "#5B8FF9"

[[row]]
id = "serde encode.5field"

[[row]]
id = "serde decode.singleScan"

[[row]]
id = "storage block.write"

[[row]]
id = "storage engine.put"

[[row]]
id = "storage engine.get.segment"

[[row]]
id = "storage memtable.range"

[[row]]
id = "query collection.get"

[[row]]
id = "query collection.indexLookup"

[[row]]
id = "query collection.indexRange"

[[row]]
id = "query collection.textSearch"

[[row]]
id = "query graph.outgoing"

[[row]]
id = "query reference.put"
